name: Build LiteBridge

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Compile
        run: swift build -c release --arch x86_64

      - name: Create .app bundle
        run: bash scripts/make_app.sh

      - name: Zip app
        run: ditto -c -k --keepParent build/LiteBridge.app build/LiteBridge.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LiteBridge-intel
          path: build/LiteBridge.zip
